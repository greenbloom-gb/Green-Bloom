<style>
  :root{
    --cream:#FAF6EE;
    --cream-deep:#F1E9D8;
    --card:#F3ECDD;
    --ink:#3B2E22;
    --ink-soft:#6E5F4F;
    --sage:#5E6B3B;
    --sage-deep:#3D4522;
    --sage-pale:#E4E7D6;
    --rust:#B35A4E;
    --rust-deep:#8F4038;
    --gold:#BE9A46;
    --line:rgba(59,46,34,0.14);
    --shadow:0 20px 50px -20px rgba(59,46,34,0.35);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  h1,h2,h3,h4,.serif{
    font-family:'Fraunces',serif;
    color:var(--ink);
    font-weight:650;
    letter-spacing:-0.01em;
    margin:0;
  }
  p{margin:0;}
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;
    letter-spacing:0.14em;text-transform:uppercase;color:var(--rust-deep);
  }
  .eyebrow::before{content:"";width:16px;height:1px;background:var(--rust-deep);}

  /* ===== HEADER ===== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(250,246,238,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;max-width:1120px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-weight:650;font-size:19px;}
  .logo-mark{width:38px;height:38px;border-radius:50%;flex-shrink:0;overflow:hidden;box-shadow:0 2px 8px -2px rgba(59,46,34,0.35);}
  .logo-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .nav-cta{
    background:var(--rust);color:#fff;padding:10px 20px;border-radius:100px;
    font-weight:600;font-size:14px;white-space:nowrap;
    transition:background .2s ease;
  }
  .nav-cta:hover{background:var(--rust-deep);}

  /* ===== HERO ===== */
  .hero{padding:64px 0 56px;}
  .hero-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:56px;align-items:center;}
  .hero h1{font-size:clamp(32px,4.4vw,52px);line-height:1.06;margin:18px 0 20px;}
  .hero h1 em{font-style:normal;color:var(--sage-deep);border-bottom:3px solid var(--gold);}
  .hero-sub{font-size:18px;color:var(--ink-soft);max-width:52ch;margin-bottom:28px;}
  .trust-row{display:flex;flex-wrap:wrap;gap:10px 22px;margin-bottom:32px;}
  .trust-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-soft);font-weight:500;}
  .trust-item svg{width:16px;height:16px;flex-shrink:0;color:var(--sage);}
  .cta-block{display:flex;flex-wrap:wrap;align-items:center;gap:18px;}
  .btn-primary{
    background:var(--rust);color:#fff;padding:17px 30px;border-radius:100px;
    font-weight:700;font-size:16px;box-shadow:0 14px 30px -10px rgba(168,92,52,0.55);
    transition:transform .2s ease,background .2s ease;display:inline-block;border:none;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .btn-primary:hover{transform:translateY(-2px);background:var(--rust-deep);}
  .price-tag{display:flex;flex-direction:column;}
  .price-was{font-size:13px;color:var(--ink-soft);text-decoration:line-through;}
  .price-now{font-family:'Fraunces',serif;font-size:26px;font-weight:650;color:var(--sage-deep);}
  .price-now span{font-size:13px;font-weight:500;color:var(--ink-soft);font-family:'Inter',sans-serif;}

  .hero-visual{position:relative;}
  .book-frame{
    position:relative;transform:rotate(2.2deg);
    box-shadow:var(--shadow);border-radius:14px;overflow:hidden;
    border:1px solid var(--line);
  }
  .book-frame img{width:100%;}
  .badge-float{
    position:absolute;bottom:-18px;left:-18px;background:var(--sage-deep);color:#fff;
    padding:14px 18px;border-radius:14px;box-shadow:0 16px 30px -14px rgba(63,74,52,0.6);
    font-family:'Fraunces',serif;transform:rotate(-3deg);
    display:flex;align-items:center;gap:10px;
  }
  .badge-float .num{font-size:26px;font-weight:650;line-height:1;}
  .badge-float .label{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.85;max-width:80px;line-height:1.3;}

  /* ===== SECTION GENERIC ===== */
  section{padding:72px 0;}
  .section-head{max-width:640px;margin:0 auto 44px;text-align:center;}
  .section-head h2{font-size:clamp(26px,3.2vw,38px);margin-top:14px;line-height:1.15;}
  .section-head p{color:var(--ink-soft);font-size:16.5px;margin-top:14px;}
  .center{text-align:center;}

  /* ===== PAIN POINTS ===== */
  .pain-section{background:var(--sage-deep);color:#F1E9D8;}
  .pain-section .eyebrow{color:#C9D2BD;}
  .pain-section .eyebrow::before{background:#C9D2BD;}
  .pain-section h2{color:#FAF6EE;}
  .pain-section .section-head p{color:#CBD3BE;}
  .pain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .pain-card{
    background:rgba(250,246,238,0.06);border:1px solid rgba(250,246,238,0.18);
    border-radius:14px;padding:22px 20px;font-size:15px;
  }
  .pain-card svg{width:22px;height:22px;color:#D6A85E;margin-bottom:12px;}

  /* ===== TOC / LEDGER ===== */
  .ledger-section{background:var(--cream);}
  .ledger{border-top:1px solid var(--line);}
  .ledger-item{
    display:grid;grid-template-columns:70px 1fr auto;gap:24px;align-items:center;
    padding:22px 8px;border-bottom:1px solid var(--line);
  }
  .ledger-item .cap-num{font-family:'Fraunces',serif;font-size:15px;color:var(--rust-deep);font-weight:650;}
  .ledger-item .cap-title{font-family:'Fraunces',serif;font-size:19px;font-weight:650;}
  .ledger-item .cap-desc{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .ledger-item .cap-tag{
    font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    background:var(--sage-pale);color:var(--sage-deep);padding:6px 12px;border-radius:100px;white-space:nowrap;
  }

  /* ===== BONUS ===== */
  .bonus-section{background:var(--cream-deep);}
  .bonus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
  .bonus-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 22px;}
  .bonus-card svg{width:24px;height:24px;color:var(--rust);margin-bottom:14px;}
  .bonus-card h4{font-size:17px;margin-bottom:8px;}
  .bonus-card p{font-size:14px;color:var(--ink-soft);}

  /* ===== AUTHORITY / DISCLAIMER STRIP ===== */
  .authority{
    display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;
  }
  .authority-card{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;
  }
  .authority-card h3{font-size:22px;margin-bottom:14px;}
  .authority-card p{color:var(--ink-soft);font-size:15px;}
  .disclaimer-box{
    border:1px solid #E3D9A8;background:#FBF6E3;border-radius:16px;padding:24px;font-size:13.5px;color:#6b5c2a;
  }
  .disclaimer-box strong{color:#4b3f1c;}

  /* ===== PRICING ===== */
  .pricing-section{background:var(--sage-deep);color:#F1E9D8;text-align:center;}
  .pricing-card{
    max-width:480px;margin:0 auto;background:#FAF6EE;color:var(--ink);border-radius:22px;
    padding:40px 34px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.4);
  }
  .pricing-card .stack-list{text-align:left;margin:26px 0;display:flex;flex-direction:column;gap:12px;}
  .stack-list .row{display:flex;justify-content:space-between;font-size:14.5px;padding-bottom:10px;border-bottom:1px dashed var(--line);}
  .stack-list .row.total{font-weight:700;border-bottom:none;padding-top:4px;font-size:16px;}
  .pricing-card .final-price{font-family:'Fraunces',serif;font-size:44px;font-weight:650;color:var(--sage-deep);margin:6px 0;}
  .pricing-card .old-price{font-size:15px;color:var(--ink-soft);text-decoration:line-through;}
  .guarantee-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;font-size:13.5px;color:var(--ink-soft);}
  .guarantee-row svg{width:20px;height:20px;color:var(--sage);}

  /* ===== FAQ ===== */
  .faq-item{border-bottom:1px solid var(--line);}
  .faq-q{
    display:flex;justify-content:space-between;align-items:center;gap:20px;
    padding:22px 4px;cursor:pointer;font-family:'Fraunces',serif;font-size:17px;font-weight:600;
  }
  .faq-q .plus{font-size:22px;color:var(--rust);transition:transform .25s ease;flex-shrink:0;}
  .faq-item.open .plus{transform:rotate(45deg);}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .faq-a p{padding:0 4px 22px;color:var(--ink-soft);font-size:15px;max-width:70ch;}

  /* ===== FINAL CTA ===== */
  .final-cta{text-align:center;background:var(--cream-deep);}
  .final-cta h2{font-size:clamp(28px,3.6vw,42px);max-width:14ch;margin:16px auto 18px;}
  .final-cta p{color:var(--ink-soft);max-width:50ch;margin:0 auto 30px;font-size:16.5px;}

  footer{padding:36px 0 100px;text-align:center;font-size:13px;color:var(--ink-soft);}
  footer .foot-links{margin-top:10px;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;}

  /* Sticky mobile bar */
  .sticky-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:60;background:#FAF6EE;
    border-top:1px solid var(--line);padding:12px 18px;display:none;
    align-items:center;justify-content:space-between;gap:14px;
    box-shadow:0 -10px 30px -14px rgba(0,0,0,0.2);
  }
  .sticky-bar .price-now{font-size:18px;}
  .sticky-bar .btn-primary{padding:13px 22px;font-size:14.5px;}

  @media(max-width:880px){
    .hero-grid{grid-template-columns:1fr;gap:40px;}
    .hero-visual{order:-1;max-width:380px;margin:0 auto;}
    .pain-grid{grid-template-columns:1fr 1fr;}
    .bonus-grid{grid-template-columns:1fr 1fr;}
    .authority{grid-template-columns:1fr;}
    .ledger-item{grid-template-columns:44px 1fr;}
    .ledger-item .cap-tag{grid-column:2;justify-self:start;margin-top:4px;}
    .sticky-bar{display:flex;}
    body{padding-bottom:78px;}
  }
  @media(max-width:560px){
    .pain-grid{grid-template-columns:1fr;}
    .bonus-grid{grid-template-columns:1fr;}
    section{padding:52px 0;}
  }

  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;scroll-behavior:auto !important;}
  }
</style>
</head>
