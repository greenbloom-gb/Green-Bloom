<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Bloom • Painel Administrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Palette Green Bloom exata */
      --gb-floresta: #4A6741;
      --gb-salvia: #7A9E7E;
      --gb-menta: #D6E8D4;
      --gb-petala: #A85970;
      --gb-bloom: #D4879A;
      --gb-palido: #F7E4E9;
      --gb-creme: #FAF6F1;
      --gb-grafite: #2C2C2C;
      --gb-cinza: #6B6B6B;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    
    body { 
      background: var(--gb-creme); 
      color: var(--gb-grafite); 
      font-family: 'DM Sans', sans-serif; 
      padding: 20px 16px 80px; 
    }

    /* Cabeçalho com contraste corrigido */
    .header {
      background: linear-gradient(135deg, var(--gb-floresta), var(--gb-salvia));
      padding: 30px 24px;
      border-radius: 32px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      box-shadow: 0 12px 35px rgba(74, 103, 65, 0.2);
    }
    .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: #FFFFFF !important; }
    .header p { font-size: 13px; opacity: 0.9; color: #FFFFFF !important; }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #FFFFFF; padding: 10px 20px; border-radius: 14px;
      cursor: pointer; font-size: 12px; font-weight: 700;
    }

    .card {
      background: #FFFFFF;
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.03);
      margin-bottom: 30px;
      border: 1px solid rgba(168, 89, 112, 0.15);
    }
    .card-title { 
      font-family: 'Cormorant Garamond', serif; 
      font-size: 26px; 
      color: var(--gb-floresta); 
      margin-bottom: 22px;
      font-style: italic;
    }

    /* Labels e Inputs com cores visíveis */
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 8px; font-size: 11px; font-weight: 700; color: var(--gb-grafite); text-transform: uppercase; letter-spacing: 1px; }
    .field input, .field textarea, .field select {
      width: 100%; border: 1.5px solid var(--gb-menta); background: var(--gb-creme);
      border-radius: 14px; padding: 14px; font-size: 14px; color: var(--gb-grafite) !important; transition: 0.3s;
    }
    .field input::placeholder { color: var(--gb-cinza); opacity: 0.6; }

    /* Área de Preview */
    .img-preview {
      width: 100%; height: 160px; background: var(--gb-palido); border: 2px dashed var(--gb-bloom);
      border-radius: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    #pImg { max-height: 100%; max-width: 100%; object-fit: contain; display: none; }

    .btn-save {
      width: 100%; 
      background: linear-gradient(135deg, var(--gb-petala), var(--gb-bloom));
      color: #FFFFFF; border: none;
      padding: 18px; border-radius: 16px; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 6px 20px rgba(168, 89, 112, 0.25);
    }

    /* Grid de produtos ativos */
    .p-card { background: #FFFFFF; border-radius: 24px; padding: 12px; border: 1px solid var(--gb-menta); margin-bottom: 15px; }
    .p-info h3 { font-size: 14px; font-weight: 700; margin-top: 10px; color: var(--gb-floresta); text-align: center; }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <h1>Green Bloom</h1>
      <p>Essência da Mulher • Gestão</p>
    </div>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </header>

  <section class="card">
    <h2 class="card-title" id="formTitle">Novo Conteúdo</h2>
    <form id="productForm">
      <div class="img-preview" id="pBox">
        <span id="pTxt" style="color: var(--gb-petala); font-weight: 600;">Preview do Produto</span>
        <img id="pImg">
      </div>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="field"><label>Nome</label><input type="text" id="name" required placeholder="Ex: Óleo Essencial"></div>
        <div class="field"><label>Categoria</label><input type="text" id="category" placeholder="Ex: Autocuidado"></div>
      </div>

      <div class="field"><label>URL da Imagem</label><input type="url" id="image" required placeholder="https://..." oninput="handlePreview(this.value)"></div>
      <div class="field"><label>Descrição</label><textarea id="description" rows="2" placeholder="Breve detalhe sobre o item..."></textarea></div>

      <div class="field">
        <label>Badge de Destaque</label>
        <select id="badge">
          <option value="">Nenhuma</option>
          <option value="🌿 Orgânico">🌿 Orgânico</option>
          <option value="⭐ Destaque">⭐ Destaque</option>
          <option value="✨ Novidade">✨ Novidade</option>
          <option value="🔥 Mais Vendido">🔥 Mais Vendido</option>
        </select>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="field"><label>🛍️ Shopee</label><input type="url" id="shopee_link"></div>
        <div class="field"><label>🛒 Mercado Livre</label><input type="url" id="mercadolivre_link"></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div class="field"><label>📦 Amazon</label><input type="url" id="amazon_link"></div>
        <div class="field"><label>🎵 TikTok Shop</label><input type="url" id="tiktok_link"></div>
      </div>

      <button type="submit" class="btn-save" id="saveBtn">Publicar Conteúdo</button>
      <button type="button" id="cancelBtn" style="display:none; background:none; border:none; color:var(--gb-petala); width:100%; margin-top:10px; cursor:pointer; font-weight:700;" onclick="resetForm()">Cancelar Edição</button>
    </form>
  </section>

  <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 26px; color: var(--gb-floresta); margin-bottom: 15px; padding-left: 10px;">Conteúdos Ativos</h2>
  <div id="grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px;"></div>

  <script>
    /* Segurança */
    (function() {
      if (localStorage.getItem('gb_token') !== 'gb_authenticated_access_2026') {
        window.location.href = '/entrar.html';
      }
    })();

    function logout() {
      localStorage.removeItem('gb_token');
      window.location.href = '/entrar.html';
    }

    let allProducts = [];
    let editMode = false;
    let currentEditId = null;

    /* Lógica de Preview */
    function handlePreview(url) {
      const img = document.getElementById('pImg');
      const txt = document.getElementById('pTxt');
      if(url && url.startsWith('http')) {
        img.src = url; img.style.display = 'block'; txt.style.display = 'none';
      } else {
        img.style.display = 'none'; txt.style.display = 'block';
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        const grid = document.getElementById('grid');
        grid.innerHTML = allProducts.map(p => `
          <div class="p-card">
            <img src="${p.image}" style="width:100%; height:120px; object-fit:contain; border-radius:12px;">
            <div class="p-info">
              <h3>${p.name}</h3>
              <div style="display:flex; gap:5px; margin-top:10px;">
                <button onclick="prepararEdicao('${p.id}')" style="flex:1; padding:6px; border:none; border-radius:8px; background:var(--gb-menta); color:var(--gb-floresta); font-size:11px; font-weight:700; cursor:pointer;">Editar</button>
                <button onclick="deleteP('${p.id}')" style="padding:6px; border:none; border-radius:8px; background:var(--gb-palido); color:var(--gb-petala); font-size:11px; font-weight:700; cursor:pointer;">Excluir</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }

    function prepararEdicao(id) {
      const p = allProducts.find(item => item.id === id);
      if(!p) return;
      editMode = true;
      currentEditId = id;
      document.getElementById('formTitle').innerText = "✏️ Editando Conteúdo";
      document.getElementById('saveBtn').innerText = "Salvar Alterações";
      document.getElementById('cancelBtn').style.display = "block";
      
      document.getElementById('name').value = p.name || '';
      document.getElementById('category').value = p.category || '';
      document.getElementById('image').value = p.image || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('badge').value = p.badge || '';
      document.getElementById('shopee_link').value = p.shopee_link || '';
      document.getElementById('mercadolivre_link').value = p.mercadolivre_link || '';
      document.getElementById('amazon_link').value = p.amazon_link || '';
      document.getElementById('tiktok_link').value = p.tiktok_link || '';
      
      handlePreview(p.image);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editMode = false;
      currentEditId = null;
      document.getElementById('productForm').reset();
      document.getElementById('formTitle').innerText = "Novo Conteúdo";
      document.getElementById('saveBtn').innerText = "Publicar Conteúdo";
      document.getElementById('cancelBtn').style.display = "none";
      handlePreview('');
    }

    document.getElementById('productForm').onsubmit = async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        image: document.getElementById('image').value,
        description: document.getElementById('description').value,
        badge: document.getElementById('badge').value,
        shopee_link: document.getElementById('shopee_link').value,
        mercadolivre_link: document.getElementById('mercadolivre_link').value,
        amazon_link: document.getElementById('amazon_link').value,
        tiktok_link: document.getElementById('tiktok_link').value
      };
      if(editMode) payload.id = currentEditId;
      await fetch('/api/update-products', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      resetForm();
      load();
    };

    async function deleteP(id) {
      if(confirm('Excluir?')) {
        await fetch('/api/delete-product', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({id})
        });
        load();
      }
    }

    load();
  </script>
</body>
</html>
