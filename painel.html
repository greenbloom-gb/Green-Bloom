<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Bloom • Gestor de Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gb-deep: #1B3022;
      --gb-leaf: #2D5A27;
      --gb-sage: #8DAA91;
      --gb-cream: #FAF9F6;
      --gb-accent: #C5D1C3;
      --gb-white: #FFFFFF;
      --gb-text: #2C332E;
      --gb-error: #9E2A2B;
    }

    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--gb-cream); color: var(--gb-text); padding: 20px 16px 80px; }

    .header {
      background: var(--gb-deep);
      padding: 24px;
      border-radius: 24px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(27, 48, 34, 0.15);
    }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }

    .card {
      background: var(--gb-white);
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      margin-bottom: 24px;
    }
    .card-title { font-size: 18px; font-weight: 800; color: var(--gb-deep); margin-bottom: 18px; }

    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 700; color: var(--gb-leaf); }
    .field input, .field textarea, .field select {
      width: 100%; border: 1.5px solid #E9EDEA; background: #F9FBF9;
      border-radius: 12px; padding: 12px; font-size: 14px; transition: 0.3s;
    }
    .field input:focus { border-color: var(--gb-leaf); outline: none; background: white; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .img-preview {
      width: 100%; height: 140px; background: #F0F4F1; border: 2px dashed var(--gb-accent);
      border-radius: 16px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .img-preview img { max-height: 100%; max-width: 100%; object-fit: contain; display: none; }

    .btn-save {
      width: 100%; background: var(--gb-leaf); color: white; border: none;
      padding: 16px; border-radius: 14px; font-size: 15px; font-weight: 800;
      cursor: pointer; transition: 0.3s; margin-top: 10px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .p-card { background: white; border-radius: 20px; padding: 10px; border: 1px solid #F0F4F1; }
    .p-card img { width: 100%; height: 110px; object-fit: contain; border-radius: 12px; background: #F9FBF9; }
    .p-info h3 { font-size: 13px; font-weight: 800; margin-top: 8px; color: var(--gb-deep); text-align: center; }
    
    .status { padding: 12px; border-radius: 12px; text-align: center; display: none; margin-top: 10px; font-size: 13px; font-weight: 700; }
    .success { background: #E8F5E9; color: #2E7D32; }
    .error { background: #FFEBEE; color: #C62828; }
    
    .logout-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .logout-btn:hover { background: white; color: var(--gb-deep); }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <h1>Green Bloom</h1>
      <p>Gestão de Produtos</p>
    </div>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </header>

  <section class="card">
    <h2 class="card-title" id="formTitle">🌿 Novo Produto</h2>
    <form id="productForm">
      <div class="img-preview" id="pBox"><span id="pTxt">Preview da Imagem</span><img id="pImg"></div>
      
      <div class="row">
        <div class="field"><label>Nome do Produto</label><input type="text" id="name" required></div>
        <div class="field"><label>Categoria</label><input type="text" id="category"></div>
      </div>

      <div class="field"><label>URL da Imagem</label><input type="url" id="image" required oninput="handlePreview(this.value, 'pImg', 'pTxt')"></div>
      <div class="field"><label>Descrição Curta</label><textarea id="description" rows="2"></textarea></div>

      <div class="field">
        <label>Badge (Etiqueta)</label>
        <select id="badge">
          <option value="">Nenhum</option>
          <option value="🌿 Orgânico">🌿 Orgânico</option>
          <option value="⭐ Destaque">⭐ Destaque</option>
          <option value="✨ Novidade">✨ Novidade</option>
          <option value="🔥 Mais Vendido">🔥 Mais Vendido</option>
        </select>
      </div>

      <div class="row">
        <div class="field"><label>🛍️ Link Shopee</label><input type="url" id="shopee_link"></div>
        <div class="field"><label>🛒 Link Mercado Livre</label><input type="url" id="mercadolivre_link"></div>
      </div>
      <div class="row">
        <div class="field"><label>📦 Link Amazon</label><input type="url" id="amazon_link"></div>
        <div class="field"><label>🎵 Link TikTok Shop</label><input type="url" id="tiktok_link"></div>
      </div>

      <button type="submit" class="btn-save" id="saveBtn">Cadastrar Produto</button>
      <button type="button" id="cancelBtn" style="display:none; width:100%; background:transparent; border:none; color:var(--gb-sage); margin-top:10px; cursor:pointer; font-weight:700;" onclick="resetForm()">Cancelar Edição</button>
      <div id="status" class="status"></div>
    </form>
  </section>

  <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center;">
    <h2 style="font-weight:800; color:var(--gb-deep)">Produtos no Banco</h2>
    <span id="counter" style="background:var(--gb-accent); padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700;">0 itens</span>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    /* ─── TRAVA DE SEGURANÇA ─── */
    (function() {
      const token = localStorage.getItem('gb_token');
      if (token !== 'gb_authenticated_access_2026') {
        window.location.href = '/entrar.html';
      }
    })();

    function logout() {
      localStorage.removeItem('gb_token');
      window.location.href = '/entrar.html';
    }

    /* ─── LÓGICA DO PAINEL ─── */
    let allProducts = [];
    let editMode = false;
    let currentEditId = null;

    function handlePreview(url, imgId, txtId) {
      const img = document.getElementById(imgId);
      const txt = document.getElementById(txtId);
      if(url && url.length > 10) { 
        img.src = url; img.style.display = 'block'; txt.style.display = 'none'; 
      } else { 
        img.style.display = 'none'; txt.style.display = 'block'; 
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        renderGrid();
      } catch (err) { console.error("Erro ao carregar", err); }
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      document.getElementById('counter').innerText = `${allProducts.length} itens`;
      
      grid.innerHTML = allProducts.map(p => `
        <div class="p-card">
          <img src="${p.image || ''}" onerror="this.src='https://placehold.co/200x200?text=Sem+Imagem'">
          <div class="p-info">
            <h3>${p.name}</h3>
            <div style="display:flex; gap:5px; margin-top:8px;">
              <button onclick="prepararEdicao('${p.id}')" style="flex:1; padding:7px; border:none; border-radius:8px; background:#F0F4F1; font-size:10px; font-weight:700; cursor:pointer;">Editar</button>
              <button onclick="deleteP('${p.id}')" style="padding:7px; border:none; border-radius:8px; background:#FFF0F0; color:var(--gb-error); font-size:10px; font-weight:700; cursor:pointer;">Excluir</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function prepararEdicao(id) {
      const p = allProducts.find(item => String(item.id) === String(id));
      if(!p) return;

      editMode = true;
      currentEditId = id;
      
      document.getElementById('formTitle').innerText = "✏️ Editando: " + p.name;
      document.getElementById('saveBtn').innerText = "Salvar Alterações";
      document.getElementById('cancelBtn').style.display = "block";

      document.getElementById('name').value = p.name || '';
      document.getElementById('category').value = p.category || '';
      document.getElementById('image').value = p.image || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('badge').value = p.badge || '';
      document.getElementById('shopee_link').value = p.shopee_link || '';
      document.getElementById('mercadolivre_link').value = p.mercadolivre_link || '';
      document.getElementById('amazon_link').value = p.amazon_link || '';
      document.getElementById('tiktok_link').value = p.tiktok_link || '';
      
      handlePreview(p.image, 'pImg', 'pTxt');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editMode = false;
      currentEditId = null;
      document.getElementById('productForm').reset();
      document.getElementById('formTitle').innerText = "🌿 Novo Produto";
      document.getElementById('saveBtn').innerText = "Cadastrar Produto";
      document.getElementById('cancelBtn').style.display = "none";
      handlePreview('', 'pImg', 'pTxt');
    }

    document.getElementById('productForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      const status = document.getElementById('status');
      btn.innerText = 'Processando...';
      
      const payload = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        image: document.getElementById('image').value,
        description: document.getElementById('description').value,
        badge: document.getElementById('badge').value,
        shopee_link: document.getElementById('shopee_link').value,
        mercadolivre_link: document.getElementById('mercadolivre_link').value,
        amazon_link: document.getElementById('amazon_link').value,
        tiktok_link: document.getElementById('tiktok_link').value
      };

      if(editMode) payload.id = currentEditId;

      try {
        const r = await fetch('/api/update-products', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        
        if(r.ok) {
          status.innerText = editMode ? "✅ Produto atualizado!" : "✅ Produto cadastrado!";
          status.className = "status success";
          status.style.display = "block";
          resetForm();
          await load();
        } else { throw new Error(); }
      } catch (err) {
        status.innerText = "❌ Erro ao salvar dados.";
        status.className = "status error";
        status.style.display = "block";
      } finally {
        btn.innerText = editMode ? 'Salvar Alterações' : 'Cadastrar Produto';
        setTimeout(() => status.style.display = 'none', 3000);
      }
    };

    async function deleteP(id) {
      if(!confirm('Deseja excluir este produto permanentemente?')) return;
      try {
        await fetch('/api/delete-product', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({id})
        });
        await load();
      } catch(e) { alert("Erro ao excluir"); }
    }

    load();
  </script>
</body>
</html>
