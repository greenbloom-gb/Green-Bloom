<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Bloom • Painel Editorial</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root{
      --sage-dark:#4A6741;
      --sage:#7A9E7E;
      --sage-light:#A8C5A0;

      --rose-deep:#A85970;
      --rose:#D4879A;
      --rose-light:#EDB8C4;

      --cream:#FAF6F1;
      --card:#FFFFFF;

      --text-dark:#2C2C2C;
      --text-mid:#6B6B6B;

      --border:rgba(168,89,112,0.12);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'DM Sans',sans-serif;
    }

    body{
      background:var(--cream);
      color:var(--text-dark);
      padding:18px 14px 60px;
    }

    /* fundo suave editorial */
    body::before{
      content:'';
      position:fixed;
      top:-120px;
      right:-120px;
      width:360px;
      height:360px;
      background:radial-gradient(circle, rgba(237,184,196,.18), transparent 70%);
      z-index:0;
    }

    body::after{
      content:'';
      position:fixed;
      bottom:-120px;
      left:-120px;
      width:320px;
      height:320px;
      background:radial-gradient(circle, rgba(168,197,160,.18), transparent 70%);
      z-index:0;
    }

    /* HERO */
    .hero{
      position:relative;
      background:linear-gradient(135deg,var(--sage-dark),var(--sage));
      padding:22px;
      border-radius:24px;
      color:white;
      box-shadow:0 18px 40px rgba(74,103,65,.25);
      overflow:hidden;
    }

    .hero::before{
      content:'';
      position:absolute;
      top:-40px;
      right:-40px;
      width:160px;
      height:160px;
      background:rgba(237,184,196,.15);
      border-radius:50%;
    }

    .hero h1{
      font-family:'Cormorant Garamond',serif;
      font-size:24px;
      font-weight:300;
    }

    .hero p{
      font-size:13px;
      opacity:.85;
      margin-top:4px;
    }

    .logout-btn{
      margin-top:14px;
      background:rgba(255,255,255,.15);
      border:none;
      color:white;
      padding:10px 14px;
      border-radius:12px;
      font-weight:600;
      cursor:pointer;
    }

    /* FORM */
    .form-card{
      margin-top:18px;
      background:white;
      padding:18px;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(0,0,0,.05);
      border:1px solid var(--border);
    }

    .form-title{
      font-family:'Cormorant Garamond',serif;
      font-size:20px;
      color:var(--sage-dark);
      margin-bottom:14px;
    }

    /* INPUTS */
    .field{ margin-bottom:12px; }

    .field label{
      font-size:12px;
      font-weight:600;
      color:var(--text-mid);
    }

    .field input,
    .field textarea,
    .field select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      outline:none;
      font-size:13px;
      transition:.2s;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus{
      border-color:var(--rose);
      box-shadow:0 0 0 3px rgba(212,135,154,.15);
    }

    .submit-btn{
      width:100%;
      border:none;
      padding:14px;
      border-radius:14px;
      background:linear-gradient(135deg,var(--rose),var(--rose-deep));
      color:white;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 10px 20px rgba(168,89,112,.25);
    }

    /* PRODUTOS */
    .products-header{
      display:flex;
      justify-content:space-between;
      margin-top:20px;
      margin-bottom:10px;
    }

    .products-title{
      font-family:'Cormorant Garamond',serif;
      font-size:20px;
    }

    .products-count{
      font-size:12px;
      color:var(--text-mid);
    }

    /* GRID */
    .products-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }

    .product-card{
      background:white;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 20px rgba(0,0,0,.05);
      border:1px solid var(--border);
    }

    .product-image{
      background:var(--cream);
      padding:12px;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .product-image img{
      width:100%;
      height:100px;
      object-fit:contain;
    }

    .product-content{
      padding:10px;
    }

    .category{
      font-size:10px;
      background:rgba(168,197,160,.25);
      padding:3px 8px;
      border-radius:999px;
      display:inline-block;
      margin-bottom:6px;
      color:var(--sage-dark);
    }

    .product-name{
      font-family:'Cormorant Garamond',serif;
      font-size:14px;
      font-weight:600;
    }

    .product-description{
      font-size:11px;
      color:var(--text-mid);
      margin-top:4px;
    }

    .actions{
      margin-top:10px;
      display:flex;
      gap:6px;
    }

    .edit-btn{
      flex:1;
      padding:8px;
      border:none;
      border-radius:10px;
      background:var(--sage);
      color:white;
      font-size:11px;
      font-weight:600;
    }

    .delete-btn{
      flex:1;
      padding:8px;
      border:none;
      border-radius:10px;
      background:#f8e6ea;
      color:var(--rose-deep);
      font-size:11px;
      font-weight:600;
    }

  </style>
</head>

<body>

  <section class="hero">
    <h1>Green Bloom</h1>
    <p>Painel editorial de conteúdo</p>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </section>

  <section class="form-card">
    <div class="form-title">Novo conteúdo</div>

    <form id="productForm">

      <div class="field">
        <label>Nome</label>
        <input type="text" id="name" required />
      </div>

      <div class="field">
        <label>Imagem</label>
        <input type="url" id="image" required />
      </div>

      <div class="field">
        <label>Categoria</label>
        <input type="text" id="category" />
      </div>

      <div class="field">
        <label>Descrição</label>
        <textarea id="description"></textarea>
      </div>

      <button class="submit-btn">Publicar</button>
    </form>
  </section>

  <div class="products-header">
    <div class="products-title">Conteúdos</div>
    <div class="products-count" id="productsCount">0 itens</div>
  </div>

  <div class="products-grid" id="productsGrid"></div>

<script>
let todosProdutos = [];

async function carregarProdutos(){
  const res = await fetch('/api/products');
  todosProdutos = await res.json();
  renderizar(todosProdutos);
}

function renderizar(produtos){
  document.getElementById('productsCount').innerText = produtos.length + " itens";

  const grid = document.getElementById('productsGrid');
  grid.innerHTML = produtos.map(p => `
    <div class="product-card">
      <div class="product-image">
        <img src="${p.image}" />
      </div>
      <div class="product-content">
        <div class="category">${p.category || ''}</div>
        <div class="product-name">${p.name}</div>
        <div class="product-description">${p.description || ''}</div>

        <div class="actions">
          <button class="edit-btn">Editar</button>
          <button class="delete-btn">Excluir</button>
        </div>
      </div>
    </div>
  `).join('');
}

document.getElementById('productForm').addEventListener('submit', async e=>{
  e.preventDefault();

  await fetch('/api/update-products',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      name:document.getElementById('name').value,
      image:document.getElementById('image').value,
      category:document.getElementById('category').value,
      description:document.getElementById('description').value
    })
  });

  carregarProdutos();
  e.target.reset();
});

function logout(){
  localStorage.removeItem('adminAuth');
  window.location.href='/entrar-farnutri.html';
}

carregarProdutos();
</script>

</body>
</html>
