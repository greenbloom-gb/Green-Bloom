<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Bloom • Painel Administrativo</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      [span_0](start_span)/* Palette Green Bloom - Extraída do PDF[span_0](end_span) */
      --gb-floresta: #4A6741;    [span_1](start_span)/* Cor Principal[span_1](end_span) */
      --gb-salvia: #7A9E7E;      [span_2](start_span)/* Suporte[span_2](end_span) */
      --gb-menta: #D6E8D4;       [span_3](start_span)/* Claro[span_3](end_span) */
      --gb-petala: #A85970;      [span_4](start_span)/* Destaque CTA[span_4](end_span) */
      --gb-bloom: #D4879A;       [span_5](start_span)/* Rosa Principal[span_5](end_span) */
      --gb-palido: #F7E4E9;      [span_6](start_span)/* Fundo suave[span_6](end_span) */
      --gb-creme: #FAF6F1;       [span_7](start_span)/* Background Geral[span_7](end_span) */
      --gb-grafite: #2C2C2C;     [span_8](start_span)/* Títulos[span_8](end_span) */
      --gb-cinza: #6B6B6B;       [span_9](start_span)/* Texto suporte[span_9](end_span) */
      --gb-white: #FFFFFF;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    
    body { 
      background: var(--gb-creme); 
      color: var(--gb-grafite); 
      font-family: 'DM Sans', sans-serif; 
      padding: 20px 16px 80px; 
    }

    /* ─── HEADER ─── */
    .header {
      background: linear-gradient(135deg, var(--gb-floresta), var(--gb-salvia));
      padding: 30px 24px;
      border-radius: 32px;
      color: var(--gb-white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      box-shadow: 0 12px 35px rgba(74, 103, 65, 0.2);
    }
    .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; }
    .header p { font-size: 13px; opacity: 0.9; font-weight: 300; }

    .logout-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white; padding: 10px 20px; border-radius: 14px;
      cursor: pointer; font-size: 12px; font-weight: 700; transition: 0.3s;
    }
    .logout-btn:hover { background: var(--gb-white); color: var(--gb-floresta); }

    /* ─── CARDS ─── */
    .card {
      background: var(--gb-white);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.03);
      margin-bottom: 30px;
      border: 1px solid rgba(168, 89, 112, 0.08);
    }
    .card-title { 
      font-family: 'Cormorant Garamond', serif; 
      font-size: 24px; 
      color: var(--gb-floresta); 
      margin-bottom: 22px;
      font-style: italic;
    }

    /* ─── FORM ─── */
    .field { margin-bottom: 18px; }
    .field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; color: var(--gb-cinza); text-transform: uppercase; letter-spacing: 1px; }
    .field input, .field textarea, .field select {
      width: 100%; border: 1.5px solid var(--gb-menta); background: var(--gb-creme);
      border-radius: 14px; padding: 14px; font-size: 14px; color: var(--gb-grafite); transition: 0.3s;
    }
    .field input:focus { border-color: var(--gb-bloom); outline: none; background: var(--gb-white); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    .img-preview {
      width: 100%; height: 160px; background: var(--gb-palido); border: 2px dashed var(--gb-bloom);
      border-radius: 20px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    }
    .img-preview img { max-height: 100%; max-width: 100%; object-fit: contain; display: none; }

    [span_10](start_span)/* Botão Principal Estilo Bloom[span_10](end_span) */
    .btn-save {
      width: 100%; 
      background: linear-gradient(135deg, var(--gb-petala), var(--gb-bloom));
      color: white; border: none;
      padding: 18px; border-radius: 16px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: 0.3s; margin-top: 10px;
      box-shadow: 0 6px 20px rgba(168, 89, 112, 0.25);
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(168, 89, 112, 0.35); }

    /* ─── LISTAGEM ─── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
    .p-card { 
      background: var(--gb-white); border-radius: 24px; padding: 12px; 
      border: 1px solid var(--gb-menta); transition: 0.3s; 
    }
    .p-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    .p-card img { width: 100%; height: 120px; object-fit: contain; border-radius: 18px; background: var(--gb-creme); }
    .p-info h3 { font-size: 14px; font-weight: 700; margin-top: 10px; color: var(--gb-floresta); text-align: center; }
    
    .status { padding: 15px; border-radius: 14px; text-align: center; display: none; margin-top: 15px; font-size: 13px; font-weight: 700; }
    .success { background: var(--gb-menta); color: var(--gb-floresta); }
    .error { background: var(--gb-palido); color: var(--gb-petala); }

    #cancelBtn { color: var(--gb-petala); font-size: 13px; font-weight: 700; cursor: pointer; display: block; margin: 15px auto; background: none; border: none; }
  </style>
</head>
<body>

  <header class="header">
    <div>
      <h1>Green Bloom</h1>
      <p>Essência da Mulher • Gestão</p>
    </div>
    <button class="logout-btn" onclick="logout()">Sair</button>
  </header>

  <section class="card">
    <h2 class="card-title" id="formTitle">Novo Conteúdo</h2>
    <form id="productForm">
      <div class="img-preview" id="pBox"><span id="pTxt" style="color: var(--gb-bloom); font-weight: 500;">Preview do Produto</span><img id="pImg"></div>
      
      <div class="row">
        <div class="field"><label>Nome</label><input type="text" id="name" required placeholder="Ex: Óleo Essencial"></div>
        <div class="field"><label>Categoria</label><input type="text" id="category" placeholder="Ex: Autocuidado"></div>
      </div>

      <div class="field"><label>URL da Imagem</label><input type="url" id="image" required oninput="handlePreview(this.value, 'pImg', 'pTxt')"></div>
      <div class="field"><label>Descrição</label><textarea id="description" rows="2" placeholder="Breve detalhe sobre o item..."></textarea></div>

      <div class="field">
        <label>Badge de Destaque</label>
        <select id="badge">
          <option value="">Nenhuma</option>
          <option value="🌿 Orgânico">🌿 Orgânico</option>
          <option value="⭐ Destaque">⭐ Destaque</option>
          <option value="✨ Novidade">✨ Novidade</option>
          <option value="🔥 Mais Vendido">🔥 Mais Vendido</option>
        </select>
      </div>

      <div class="row">
        <div class="field"><label>🛍️ Shopee</label><input type="url" id="shopee_link"></div>
        <div class="field"><label>🛒 Mercado Livre</label><input type="url" id="mercadolivre_link"></div>
      </div>
      <div class="row">
        <div class="field"><label>📦 Amazon</label><input type="url" id="amazon_link"></div>
        <div class="field"><label>🎵 TikTok Shop</label><input type="url" id="tiktok_link"></div>
      </div>

      <button type="submit" class="btn-save" id="saveBtn">Publicar Conteúdo</button>
      <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancelar Edição</button>
      <div id="status" class="status"></div>
    </form>
  </section>

  <div style="display:flex; justify-content:space-between; margin-bottom:15px; align-items:center; padding: 0 10px;">
    <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 26px; color: var(--gb-floresta);">Conteúdos Ativos</h2>
    <span id="counter" style="background: var(--gb-menta); color: var(--gb-floresta); padding:5px 15px; border-radius:20px; font-size:12px; font-weight:700;">0 itens</span>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    /* ─── TRAVA DE SEGURANÇA ─── */
    (function() {
      const token = localStorage.getItem('gb_token');
      if (token !== 'gb_authenticated_access_2026') {
        window.location.href = '/entrar.html';
      }
    })();

    function logout() {
      localStorage.removeItem('gb_token');
      window.location.href = '/entrar.html';
    }

    let allProducts = [];
    let editMode = false;
    let currentEditId = null;

    function handlePreview(url, imgId, txtId) {
      const img = document.getElementById(imgId);
      const txt = document.getElementById(txtId);
      if(url && url.length > 10) { 
        img.src = url; img.style.display = 'block'; txt.style.display = 'none'; 
      } else { 
        img.style.display = 'none'; txt.style.display = 'block'; 
      }
    }

    async function load() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        renderGrid();
      } catch (err) { console.error("Erro ao carregar", err); }
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      document.getElementById('counter').innerText = `${allProducts.length} itens`;
      grid.innerHTML = allProducts.map(p => `
        <div class="p-card">
          <img src="${p.image || ''}" onerror="this.src='https://placehold.co/200x200?text=Sem+Imagem'">
          <div class="p-info">
            <h3>${p.name}</h3>
            <div style="display:flex; gap:8px; margin-top:10px;">
              <button onclick="prepararEdicao('${p.id}')" style="flex:1; padding:8px; border:none; border-radius:10px; background:var(--gb-menta); color:var(--gb-floresta); font-size:11px; font-weight:700; cursor:pointer;">Editar</button>
              <button onclick="deleteP('${p.id}')" style="padding:8px; border:none; border-radius:10px; background:var(--gb-palido); color:var(--gb-petala); font-size:11px; font-weight:700; cursor:pointer;">Excluir</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function prepararEdicao(id) {
      const p = allProducts.find(item => String(item.id) === String(id));
      if(!p) return;
      editMode = true;
      currentEditId = id;
      document.getElementById('formTitle').innerText = "Editando Conteúdo";
      document.getElementById('saveBtn').innerText = "Salvar Alterações";
      document.getElementById('cancelBtn').style.display = "block";
      document.getElementById('name').value = p.name || '';
      document.getElementById('category').value = p.category || '';
      document.getElementById('image').value = p.image || '';
      document.getElementById('description').value = p.description || '';
      document.getElementById('badge').value = p.badge || '';
      document.getElementById('shopee_link').value = p.shopee_link || '';
      document.getElementById('mercadolivre_link').value = p.mercadolivre_link || '';
      document.getElementById('amazon_link').value = p.amazon_link || '';
      document.getElementById('tiktok_link').value = p.tiktok_link || '';
      handlePreview(p.image, 'pImg', 'pTxt');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
      editMode = false;
      currentEditId = null;
      document.getElementById('productForm').reset();
      document.getElementById('formTitle').innerText = "Novo Conteúdo";
      document.getElementById('saveBtn').innerText = "Publicar Conteúdo";
      document.getElementById('cancelBtn').style.display = "none";
      handlePreview('', 'pImg', 'pTxt');
    }

    document.getElementById('productForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      const status = document.getElementById('status');
      btn.innerText = 'Processando...';
      const payload = {
        name: document.getElementById('name').value,
        category: document.getElementById('category').value,
        image: document.getElementById('image').value,
        description: document.getElementById('description').value,
        badge: document.getElementById('badge').value,
        shopee_link: document.getElementById('shopee_link').value,
        mercadolivre_link: document.getElementById('mercadolivre_link').value,
        amazon_link: document.getElementById('amazon_link').value,
        tiktok_link: document.getElementById('tiktok_link').value
      };
      if(editMode) payload.id = currentEditId;
      try {
        const r = await fetch('/api/update-products', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });
        if(r.ok) {
          status.innerText = "Sucesso!";
          status.className = "status success";
          status.style.display = "block";
          resetForm();
          await load();
        } else { throw new Error(); }
      } catch (err) {
        status.innerText = "Erro ao salvar.";
        status.className = "status error";
        status.style.display = "block";
      } finally {
        setTimeout(() => status.style.display = 'none', 3000);
      }
    };

    async function deleteP(id) {
      if(!confirm('Deseja excluir permanentemente?')) return;
      await fetch('/api/delete-product', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({id})
      });
      load();
    }

    load();
  </script>
</body>
</html>
