<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Bloom | Essência da Mulher</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>

    /* ─── TOKENS ─── */
    :root {
      --sage-dark:   #4A6741;
      --sage:        #7A9E7E;
      --sage-light:  #A8C5A0;
      --sage-pale:   #D6E8D4;
      --rose-deep:   #A85970;
      --rose:        #D4879A;
      --rose-light:  #EDB8C4;
      --rose-pale:   #F7E4E9;
      --cream:       #FAF6F1;
      --warm-white:  #FFFFFF;
      --text-dark:   #2C2C2C;
      --text-mid:    #6B6B6B;
      --text-light:  #A8A8A8;
      --card-bg:     #FFFFFF;
      --border:      rgba(168,89,112,0.12);
    }

    body.dark {
      --cream:      #141210;
      --card-bg:    #1E1A18;
      --text-dark:  #F2EDE8;
      --text-mid:   #B0A09A;
      --text-light: #7A6E68;
      --border:     rgba(212,135,154,0.15);
    }

    /* ─── RESET ─── */
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--cream);
      color: var(--text-dark);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      transition: background .3s, color .3s;
      overflow-x: hidden;
    }

    /* ─── PETAL BACKGROUND DECORATION ─── */
    body::before {
      content: '';
      position: fixed;
      top: -120px; right: -120px;
      width: 380px; height: 380px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(237,184,196,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -80px; left: -80px;
      width: 280px; height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,197,160,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── THEME TOGGLE ─── */
    .theme-toggle {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 999;
      border: none;
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(168,89,112,0.18);
      transition: transform .2s, box-shadow .2s;
    }

    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.08);
    }

    body.dark .theme-toggle {
      background: rgba(30,26,24,0.9);
    }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 38px 24px 34px;
      background: linear-gradient(145deg, var(--sage-dark) 0%, var(--sage) 60%, #6B8F6F 100%);
      border-bottom-left-radius: 36px;
      border-bottom-right-radius: 36px;
      box-shadow: 0 12px 40px rgba(74,103,65,0.3);
      color: white;
      animation: heroIn .6s ease both;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* petal decorations inside hero */
    .hero-petal {
      position: absolute;
      border-radius: 50%;
      opacity: 0.12;
      pointer-events: none;
    }
    .hero-petal-1 {
      width: 200px; height: 200px;
      background: var(--rose-light);
      top: -60px; right: -50px;
    }
    .hero-petal-2 {
      width: 120px; height: 120px;
      background: var(--rose-pale);
      bottom: -30px; left: 40px;
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

      width: 88px; height: 88px;
      border-radius: 50%;
      padding: 3px;
