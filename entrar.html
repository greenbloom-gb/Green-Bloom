<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login • Green Bloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --gb-floresta: #4A6741;
      --gb-salvia: #7A9E7E;
      --gb-menta: #D6E8D4;
      --gb-petala: #A85970;
      --gb-bloom: #D4879A;
      --gb-palido: #F7E4E9;
      --gb-creme: #FAF6F1;
      --gb-grafite: #2C2C2C;
      --gb-white: #FFFFFF;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--gb-creme);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      width: 100%;
      max-width: 360px;
      padding: 20px;
      text-align: center;
    }

    .logo {
      width: 150px;
      margin-bottom: 40px;
      filter: drop-shadow(0 4px 12px rgba(74, 103, 65, 0.1));
    }

    .login-card {
      background: var(--gb-white);
      padding: 35px 25px;
      border-radius: 30px;
      box-shadow: 0 15px 45px rgba(74, 103, 65, 0.08);
      border: 1px solid rgba(168, 89, 112, 0.1);
    }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: var(--gb-floresta);
      margin-bottom: 10px;
      font-style: italic;
    }

    p.subtitle {
      font-size: 13px;
      color: var(--gb-salvia);
      margin-bottom: 30px;
    }

    .field {
      text-align: left;
      margin-bottom: 25px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gb-grafite);
      margin-bottom: 10px;
      padding-left: 5px;
    }

    .field input {
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1.5px solid var(--gb-menta);
      background: var(--gb-creme);
      font-size: 16px;
      color: var(--gb-grafite);
      transition: all 0.3s ease;
      outline: none;
      text-align: center;
    }

    .field input:focus {
      border-color: var(--gb-bloom);
      background: var(--gb-white);
      box-shadow: 0 0 0 5px rgba(212, 135, 154, 0.1);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--gb-petala), var(--gb-bloom));
      color: white;
      border: none;
      padding: 18px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(168, 89, 112, 0.2);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(168, 89, 112, 0.3);
    }

    .error-msg {
      color: var(--gb-petala);
      font-size: 13px;
      margin-top: 15px;
      font-weight: 600;
      display: none;
    }

    .footer-copy {
      margin-top: 40px;
      font-size: 11px;
      color: var(--gb-salvia);
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="https://i.postimg.cc/B6XBn5Cx/file-00000000eb7471f7a319373b50998f6c.png" alt="Green Bloom Logo" class="logo">

    <div class="login-card">
      <h2>Área do Admin</h2>
      <p class="subtitle">Green Bloom • Gestão</p>
      
      <div class="field">
        <label>Senha de Acesso</label>
        <input type="password" id="adminPass" placeholder="••••••••" required>
      </div>

      <button onclick="fazerLogin()" class="btn-login" id="loginBtn">Acessar Painel</button>
      <p id="errorMsg" class="error-msg">Senha incorreta. Tente novamente.</p>
    </div>

    <p class="footer-copy">© 2026 GREEN BLOOM</p>
  </div>

  <script>
    async function fazerLogin() {
      const passValue = document.getElementById('adminPass').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      if (!passValue) return;

      btn.innerText = "Verificando...";

      try {
        // Chama a sua API que criamos no arquivo api/auth.js
        const response = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: passValue })
        });

        if (response.ok) {
          const data = await response.json();
          // Salva o token que libera o painel.html
          localStorage.setItem('gb_token', data.token);
          window.location.href = '/painel.html';
        } else {
          errorMsg.style.display = 'block';
          btn.innerText = "Acessar Painel";
        }
      } catch (error) {
        console.error("Erro ao autenticar:", error);
        errorMsg.innerText = "Erro no servidor. Verifique a Vercel.";
        errorMsg.style.display = 'block';
        btn.innerText = "Acessar Painel";
      }
    }

    // Permitir login ao apertar "Enter"
    document.getElementById('adminPass').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        fazerLogin();
      }
    });
  </script>

</body>
</html>
